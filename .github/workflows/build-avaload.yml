name: Build AvaLoader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download MelonLoader 0.6.6
        run: |
          mkdir -p refs
          curl -L --fail --retry 3 "https://thunderstore.io/package/download/LavaGang/MelonLoader/0.6.6/" -o /tmp/melonloader.zip
          unzip -q /tmp/melonloader.zip -d /tmp/melonloader
          find /tmp/melonloader -name MelonLoader.dll -type f -exec cp {} refs/MelonLoader.dll \;
          test -s refs/MelonLoader.dll

      - name: Build AvaLoader
        run: dotnet build AvaLoader.csproj -c Release

      - name: Verify
        run: |
          test -s bin/Release/net6.0/AvaLoader.dll
          sha256sum bin/Release/net6.0/AvaLoader.dll

      - name: Create install package
        run: |
          rm -rf package
          mkdir -p "package/Mods"
          mkdir -p "package/AvaLoader Avatar Folder"
          cp bin/Release/net6.0/AvaLoader.dll "package/Mods/AvaLoader.dll"
          cp "AvaLoader Avatar Folder/README.txt" "package/AvaLoader Avatar Folder/README.txt"
          (cd package && zip -qr ../AvaLoader-1.0.0.zip .)

      - name: Upload AvaLoader package
        uses: actions/upload-artifact@v4
        with:
          name: AvaLoader-1.0.0
          path: |
            AvaLoader-1.0.0.zip
            bin/Release/net6.0/AvaLoader.dll
