name: Build BONELAB Magazine Capacity Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download BoneLib 3.2.2
        shell: bash
        run: |
          mkdir -p References
          curl -L --fail --retry 3 "https://thunderstore.io/package/download/bonelib/BoneLib/3.2.2/" -o /tmp/bonelib.zip
          unzip -o /tmp/bonelib.zip -d /tmp/bonelib
          find /tmp/bonelib -name BoneLib.dll -exec cp {} References/BoneLib.dll \;
          test -s References/BoneLib.dll

      - name: Restore
        run: dotnet restore MagazineCapacityMod.csproj

      - name: Build
        run: dotnet build MagazineCapacityMod.csproj -c Release --no-restore

      - name: Verify DLL
        run: test -s bin/Release/net6.0/MagazineCapacityMod.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MagazineCapacityMod
          path: bin/Release/net6.0/MagazineCapacityMod.dll


  fusionkick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore FusionKick
        run: dotnet restore FusionKick/FusionKick.csproj

      - name: Build FusionKick
        run: dotnet build FusionKick/FusionKick.csproj -c Release --no-restore

      - name: Verify FusionKick DLL
        run: test -s FusionKick/FusionKick.dll

      - name: Upload FusionKick DLL
        uses: actions/upload-artifact@v4
        with:
          name: FusionKick
          path: FusionKick/FusionKick.dll
